interface:
  display_name: "Live-Action-Drama-Producer"
  short_description: "V4均衡拆镜、无声旁白锚点、连续性与剧梦全流程"
  default_prompt: "使用 $live-action-drama-producer，先读取项目《引导.md》并按 V4.1 完成拆镜：完整 30 秒镜覆盖 70–90 个原文单词且分配均衡，最后一镜不足时按实际时长设计；旁白只作无声画面锚点，原视频绝不生成旁白声音。紧接镜头用尾帧辅助并保留 1–2 秒模型识别/剪辑缓冲，复杂站位用人物入景合成图辅助，必要时两者同时使用。补全必要资产并通过拆镜、引用与连续性自检后，再完成剧梦视频、旁白与独立 BGM 候选。"
