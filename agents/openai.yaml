interface:
  display_name: "Live-Action-Drama-Producer"
  short_description: "V4.2示例式导演稿、精确一键引用、连续性与剧梦全流程"
  default_prompt: "使用 $live-action-drama-producer，先读取项目《引导.md》并按唯一 V4.2 完成拆镜和示例式详细导演稿：完整 30 秒镜覆盖 70–90 个原文单词且分配均衡，最后一镜不足时按实际时长设计；把批准正文逐字符原样放入剧梦，只用一键引用绑定资产，不得把自检、连续性或 Skill 操作说明写进生成提示词。旁白只作无声画面锚点，原视频绝不生成旁白声音。紧接镜头用尾帧辅助并保留 1–2 秒模型识别/剪辑缓冲，复杂站位用人物入景合成图辅助，必要时两者同时使用。补全必要资产并通过拆镜、引用与连续性自检后，再完成剧梦视频、旁白与独立 BGM 候选。"
